<!-- Diagram of the current tenant subscription and feature-action permission schema. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Tenant product and user permission model</title>
  <desc id="desc">Platform model with products, modules, features and actions; each tenant subscribes to at least one product and grants users specific actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#edf2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18254b" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6876a8"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#192344}.title{font-size:34px;font-weight:750}.sub{font-size:16px;fill:#596684}.section{font-size:17px;font-weight:750;letter-spacing:1px;fill:#53618a}.card{fill:#fff;stroke:#d7def1;stroke-width:1.5;filter:url(#shadow)}.head{font-size:19px;font-weight:700}.field{font-size:14px;fill:#435071}.pk{font-weight:700;fill:#5646c7}.fk{font-weight:700;fill:#187d8d}.enum{font-size:12px;fill:#7a6682}.edge{fill:none;stroke:#7683ac;stroke-width:2;marker-end:url(#arrow)}.edgeLabel{font-size:12px;font-weight:650;fill:#697695}.pill{font-size:12px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="960" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Platform tenant access model</text>
  <text x="64" y="96" class="sub">Products define permissions. Tenants subscribe to products; tenant users receive explicit action assignments.</text>
  <text x="64" y="142" class="section">PRODUCT CATALOG · ERP · CHECKLISTS · DATA STUDIO · HRMS</text>

  <path class="edge" d="M380 239 H435"/><text x="384" y="225" class="edgeLabel">1 → many</text>
  <path class="edge" d="M750 239 H805"/><text x="754" y="225" class="edgeLabel">1 → many</text>
  <path class="edge" d="M1120 239 H1175"/><text x="1124" y="225" class="edgeLabel">1 → many</text>

  <g transform="translate(65 166)"><rect class="card" width="315" height="172" rx="16"/><rect width="315" height="42" rx="16" fill="#6355d9"/><path d="M0 27h315v15H0z" fill="#6355d9"/><text x="18" y="28" class="pill">PRODUCT</text><text x="18" y="72" class="head">Product</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · Key · Name</tspan></text><text x="18" y="126" class="field">Status</text><text x="18" y="153" class="enum">Unique stable product key</text></g>
  <g transform="translate(435 166)"><rect class="card" width="315" height="172" rx="16"/><rect width="315" height="42" rx="16" fill="#3978d5"/><path d="M0 27h315v15H0z" fill="#3978d5"/><text x="18" y="28" class="pill">PRODUCT STRUCTURE</text><text x="18" y="72" class="head">ProductModule</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> ProductId</tspan></text><text x="18" y="126" class="field">Key · Name · Status</text><text x="18" y="153" class="enum">Unique key within product</text></g>
  <g transform="translate(805 166)"><rect class="card" width="315" height="172" rx="16"/><rect width="315" height="42" rx="16" fill="#258caa"/><path d="M0 27h315v15H0z" fill="#258caa"/><text x="18" y="28" class="pill">PRODUCT STRUCTURE</text><text x="18" y="72" class="head">ProductFeature</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> ProductModuleId</tspan></text><text x="18" y="126" class="field">Key · Name · Status</text><text x="18" y="153" class="enum">Unique key within module</text></g>
  <g transform="translate(1175 166)"><rect class="card" width="315" height="172" rx="16"/><rect width="315" height="42" rx="16" fill="#168b83"/><path d="M0 27h315v15H0z" fill="#168b83"/><text x="18" y="28" class="pill">FEATURE PERMISSIONS</text><text x="18" y="72" class="head">ProductAction</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> ProductFeatureId</tspan></text><text x="18" y="126" class="field">Key · Name · Status</text><text x="18" y="153" class="enum">Examples: view, create, edit, export, delete</text></g>

  <text x="64" y="400" class="section">TENANTS, PRODUCT SUBSCRIPTIONS &amp; USER ACTION ASSIGNMENTS</text>
  <path class="edge" d="M380 505 H435"/><text x="386" y="491" class="edgeLabel">tenant subscribes</text>
  <path class="edge" d="M750 505 H805"/><text x="760" y="491" class="edgeLabel">tenant has members</text>
  <path class="edge" d="M1120 505 H1175"/><text x="1128" y="491" class="edgeLabel">assign actions</text>
  <path class="edge" d="M592 470 V365 H222 V340"/><text x="343" y="359" class="edgeLabel">subscription is for a product</text>
  <path class="edge" d="M1332 470 V365 H1332 V340"/><text x="1344" y="405" class="edgeLabel" transform="rotate(-90 1344 405)">assignment references action</text>

  <g transform="translate(65 470)"><rect class="card" width="315" height="190" rx="16"/><rect width="315" height="42" rx="16" fill="#bd6b30"/><path d="M0 27h315v15H0z" fill="#bd6b30"/><text x="18" y="28" class="pill">TENANT</text><text x="18" y="72" class="head">Tenant</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · Key · Name</tspan></text><text x="18" y="126" class="field">Status · CreatedAtUtc</text><text x="18" y="159" class="enum">Active tenant needs ≥ 1 active product</text></g>
  <g transform="translate(435 470)"><rect class="card" width="315" height="190" rx="16"/><rect width="315" height="42" rx="16" fill="#bd6b30"/><path d="M0 27h315v15H0z" fill="#bd6b30"/><text x="18" y="28" class="pill">TENANT PRODUCT</text><text x="18" y="72" class="head">TenantProductSubscription</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> TenantId</tspan></text><text x="18" y="126" class="field"><tspan class="fk">FK</tspan><tspan> ProductId · Status</tspan></text><text x="18" y="153" class="field">SubscribedAtUtc · ExpiresAtUtc</text><text x="18" y="177" class="enum">One row per tenant/product</text></g>
  <g transform="translate(805 470)"><rect class="card" width="315" height="190" rx="16"/><rect width="315" height="42" rx="16" fill="#bd6b30"/><path d="M0 27h315v15H0z" fill="#bd6b30"/><text x="18" y="28" class="pill">TENANT USER</text><text x="18" y="72" class="head">TenantMembership</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> TenantId</tspan></text><text x="18" y="126" class="field">UserId · Status · CreatedAtUtc</text><text x="18" y="159" class="enum">Unique user membership per tenant</text></g>
  <g transform="translate(1175 470)"><rect class="card" width="315" height="190" rx="16"/><rect width="315" height="42" rx="16" fill="#168b83"/><path d="M0 27h315v15H0z" fill="#168b83"/><text x="18" y="28" class="pill">USER PERMISSION</text><text x="18" y="72" class="head">TenantUserAction</text><text x="18" y="101" class="field"><tspan class="pk">PK</tspan><tspan> Id · </tspan><tspan class="fk">FK</tspan><tspan> TenantMembershipId</tspan></text><text x="18" y="126" class="field"><tspan class="fk">FK</tspan><tspan> ProductActionId</tspan></text><text x="18" y="153" class="field">IsActive · AssignedAtUtc</text><text x="18" y="177" class="enum">Unique action per membership</text></g>

  <rect x="65" y="720" width="1425" height="144" rx="20" fill="#e3e9fb" stroke="#cbd5f1"/>
  <text x="92" y="758" class="head">Authorize a feature action only when all checks pass</text>
  <text x="92" y="795" class="field">Tenant active  +  user has active membership in that tenant  +  tenant has active subscription to the action's product</text>
  <text x="92" y="824" class="field">+ product, module, feature, and action are active  +  that exact action is actively assigned to the user's tenant membership.</text>
  <text x="65" y="912" class="sub">IDs use int. Product action keys are data (for example, view or export), so each feature can define the permissions it needs.</text>
</svg>
