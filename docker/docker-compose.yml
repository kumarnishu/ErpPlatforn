services:
  platform-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_StrongPassw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - platform-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  platform-api:
    build:
      context: ..
      dockerfile: docker/Server.Dockerfile
      args:
        API_PROJECT: Services/Platform/Platform.Api/Platform.Api.csproj
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__PlatformDatabase: "Server=platform-db,1433;Database=Platform;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalDev_StrongPassw0rd!};TrustServerCertificate=True;Encrypt=False"
    depends_on:
      platform-db:
        condition: service_healthy

  erp-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: erp-webapp
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/erp-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

  hrms-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: hrms-webapp
    ports:
      - "3001:3001"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/hrms-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]

  dashboard-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: dashboard-webapp
    ports:
      - "3002:3002"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/dashboard-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3002"]

  superadmin-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: superadmin-webapp
    ports:
      - "3004:3004"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/superadmin-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3004"]

volumes:
  platform-sql-data:

