services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: ..
      dockerfile: docker/Server.Dockerfile
      args:
        API_PROJECT: Services/Platform/Platform.Api/Platform.Api.csproj
    ports:
      - "5000:8080"
    env_file:
      - ./platform-api.env
    depends_on:
      postgres:
        condition: service_healthy

  erp-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: erp-webapp
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/erp-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

  hrms-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: hrms-webapp
    ports:
      - "3001:3001"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/hrms-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]

  dashboard-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: dashboard-webapp
    ports:
      - "3002:3002"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/dashboard-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3002"]

  superadmin-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: superadmin-webapp
    ports:
      - "3004:3004"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/superadmin-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3004"]

volumes:
  postgresdata:
