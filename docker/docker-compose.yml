services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  platform-api:
    build:
      context: ..
      dockerfile: docker/Service.Dockerfile
      args:
        PROJECT_PATH: Services/Platform/Platform.Api/Platform.Api.csproj
        PROJECT_DLL: Platform.Api.dll
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__PlatformDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-erp_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  todos-api:
    build:
      context: ..
      dockerfile: docker/Service.Dockerfile
      args:
        PROJECT_PATH: Services/Todos/Todos.Api/Todos.Api.csproj
        PROJECT_DLL: Todos.Api.dll
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__TenantDatabaseAdmin: Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  erp-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: erp-webapp
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/erp-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

  hrms-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: hrms-webapp
    ports:
      - "3001:3001"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/hrms-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]

  dashboard-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: dashboard-webapp
    ports:
      - "3002:3002"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/dashboard-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3002"]

  superadmin-webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_DIR: superadmin-webapp
    ports:
      - "3004:3004"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../webapp/superadmin-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3004"]

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:

