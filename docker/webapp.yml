      - ../webapp/dashboard-webapp:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3002"]

  superadmin-webapp:
    build:
      context: ..
      dockerfile: docker/Webapp.Dockerfile
      args:
        APP_DIR: superadmin-webapp
    ports:
      - "3004:3004"
    environment:
      CHOKIDAR_USEPOLLING: "true"
