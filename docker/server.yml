services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  platform-api:
    build:
      context: ..
      dockerfile: docker/Server.Dockerfile
      args:
        PROJECT_PATH: Services/Platform/Platform.Api/Platform.Api.csproj
        PROJECT_DLL: Platform.Api.dll
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__PlatformDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-erp_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  todos-api:
    build:
      context: ..
      dockerfile: docker/Server.Dockerfile
      args:
        PROJECT_PATH: Services/Todos/Todos.Api/Todos.Api.csproj
        PROJECT_DLL: Todos.Api.dll
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__PlatformDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-erp_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
